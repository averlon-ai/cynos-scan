name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      scanner-image:
        description: >-
          The release's scanner image, image@sha256:<digest>, for the packed engine to pin in
          assets/image.json; empty packs no pin, and the docker runtime builds the image
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-quality:
    uses: ./.github/workflows/workflow-quality.yml

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

  package:
    name: Pack and test installation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - run: bun run build
      # A release (npm-publish.yml) pins the scanner image it published: the engine ships assets/,
      # and with assets/image.json there the docker runtime pulls that digest instead of building.
      # The file is written only here, never committed.
      - name: Pin the scanner image
        if: inputs.scanner-image != ''
        env:
          SCANNER_IMAGE: ${{ inputs.scanner-image }}
        run: |
          if ! [[ "$SCANNER_IMAGE" =~ ^([^@]+)@(sha256:[0-9a-f]{64})$ ]]; then
            echo "::error::scanner-image $SCANNER_IMAGE is not <image>@sha256:<digest>"
            exit 1
          fi
          printf '{ "image": "%s", "digest": "%s" }\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" \
            > packages/engine/assets/image.json
          cat packages/engine/assets/image.json
      - name: Pack the release artifacts
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const cli = JSON.parse(readFileSync('packages/cli/package.json'));
          const engine = JSON.parse(readFileSync('packages/engine/package.json'));
          if (cli.version !== engine.version || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(cli.version)) {
            throw new Error('Both packages must have the same stable release version');
          }
          JS
          mkdir -p dist
          npm pack --workspace @averlon-ai/cynos-scan-engine --ignore-scripts --pack-destination dist
          npm pack --workspace @averlon-ai/cynos --ignore-scripts --pack-destination dist
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Set up the Ubuntu sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      # With a pinned image, the docker runtime too: it pulls the pin with no registry login, as
      # an npm user's does.
      - name: Test the packed CLI
        env:
          CYNOS_NO_UPDATE_NOTICE: '1'
          SCANNER_IMAGE: ${{ inputs.scanner-image }}
        run: |
          runtimes=(native)
          if [ -n "$SCANNER_IMAGE" ]; then runtimes+=(docker); fi
          bash scripts/install-smoke.sh dist/averlon-ai-cynos-[0-9]*.tgz "${runtimes[@]}"
      - name: Audit installed dependencies
        run: bash scripts/audit-package.sh dist/averlon-ai-cynos-[0-9]*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages-${{ github.run_attempt }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  windows-install:
    needs: package
    uses: ./.github/workflows/install-smoke.yml
    with:
      artifact: npm-packages-${{ github.run_attempt }}

  ci:
    name: ci
    needs: [workflow-quality, test, package, windows-install]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success")' <<< "$RESULTS"
