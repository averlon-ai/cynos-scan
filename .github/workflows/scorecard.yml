name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

jobs:
  scorecard:
    if: github.repository == 'averlon-ai/cynos-scan' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      # Scorecard's public API requires the official action and forbids shell steps here.
      # This job has no npm environment and is not an npm trusted publisher.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 7
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: results.sarif
